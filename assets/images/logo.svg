<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 76" width="460" height="76">
  <defs>
    <linearGradient id="ayalaBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041B44" />
      <stop offset="100%" stop-color="#06275E" />
    </linearGradient>
    <linearGradient id="ayalaRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A35" />
      <stop offset="100%" stop-color="#E00820" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#06275E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ISOTIPO: Estructura geométrica "A" con perfil industrial, corte láser y chispa roja -->
  <g transform="translate(4, 3)">
    <!-- Base hexagonal / trapezoidal de placa industrial -->
    <path d="M 35 4 L 62 66 L 46 66 L 39 49 L 31 49 L 24 66 L 8 66 Z" fill="url(#ayalaBlueGrad)" filter="url(#softGlow)" />
    <!-- Viga / alma interior de corte -->
    <path d="M 35 17 L 43 37 L 27 37 Z" fill="#FFFFFF" />
    <!-- Acento dinámico rojo: arco de soldadura / corte de precisión -->
    <path d="M 46 12 L 67 60 L 59 66 L 40 22 Z" fill="url(#ayalaRedGrad)" />
    <!-- Círculo de remache / perno de anclaje de placa estructural -->
    <circle cx="35" cy="58" r="3.2" fill="#E00820" />
    <circle cx="35" cy="58" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- LOGOTIPO / TIPOGRAFÍA CORPORATIVA -->
  <g transform="translate(86, 0)">
    <!-- Corporación -->
    <text x="0" y="27" font-family="'Montserrat', 'Barlow', 'Arial Black', sans-serif" font-size="14" font-weight="700" letter-spacing="3.5" fill="#697680">CORPORACIÓN</text>
    
    <!-- AYALA -->
    <text x="0" y="53" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="28" font-weight="900" letter-spacing="2" fill="#06275E">AYALA <tspan fill="#E00820" font-size="20" font-weight="800">S.A.C.</tspan></text>
    
    <!-- Subtítulo de especialidad industrial -->
    <text x="1" y="69" font-family="'Inter', 'Segoe UI', sans-serif" font-size="8.8" font-weight="600" letter-spacing="1.2" fill="#697680">CORTES METÁLICOS • PLACAS INDUSTRIALES • SOLDADURA</text>
  </g>
</svg>
